services:
  postgres:
    image: postgres:16

    container_name: clicku-postgres

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clicku_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .

    container_name: clicku-backend

    restart: always

    ports:
      - "5000:5000"

    depends_on:
      - postgres

    env_file:
      - .env

volumes:
  postgres_data: