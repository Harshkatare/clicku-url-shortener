name: Backend Keep-Alive

on:
  schedule:
    # Runs every 10 minutes (prevents 15-minute inactivity spin-down)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

concurrency:
  group: keepalive-cron
  cancel-in-progress: true

jobs:
  ping:
    name: Ping Backend Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping Backend Endpoint
        run: |
          echo "Sending keep-alive ping to backend..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}\nTIME_TOTAL:%{time_total}s" -m 20 https://clicku-url-shortener.onrender.com/health)
          echo "$RESPONSE"
          if echo "$RESPONSE" | grep -q "HTTP_STATUS:200"; then
            echo "✅ Backend is awake and healthy!"
          else
            echo "⚠️ Health check returned non-200 or timed out (server cold booting or redeploying)"
          fi
